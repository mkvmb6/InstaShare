# Builds InstaShare.exe and publishes it as a GitHub release when a version tag is pushed:
#   1. Bump <Version> in InstaShare/InstaShare.csproj and commit.
#   2. git tag v2.2.0 && git push origin v2.2.0
# Installed copies find the release within a day and update themselves.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content InstaShare/InstaShare.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -ne $tag) {
            Write-Error "Tag $tag doesn't match <Version>$version</Version> in InstaShare.csproj. Updates compare that version, so they must agree."
            exit 1
          }

      - name: Test
        run: dotnet test InstaShare.Tests -c Release

      - name: Publish the exe
        run: dotnet publish InstaShare/InstaShare.csproj -c Release -p:PublishProfile=SingleExe

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = 'InstaShare/bin/publish/InstaShare.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  InstaShare.exe" | Set-Content -NoNewline -Encoding ascii InstaShare/bin/publish/InstaShare.exe.sha256
          gh release create '${{ github.ref_name }}' $exe InstaShare/bin/publish/InstaShare.exe.sha256 `
            --title 'InstaShare ${{ github.ref_name }}' --generate-notes
