<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>InstaShare</title>
    <meta name="description" content="Files shared with you through InstaShare. Preview or download them; the link expires on its own." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/og-image.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />

    <!-- Link previews in chat apps. Chat apps don't run JavaScript, so these are the same for every share. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="InstaShare" />
    <meta property="og:title" content="Files shared with you on InstaShare" />
    <meta property="og:description" content="Open to preview or download. This link expires on its own." />
    <meta property="og:image" content="https://instashare.mohitkumarverma.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="InstaShare" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Share links are private; keep them out of search results. -->
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
